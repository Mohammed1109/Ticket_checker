<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw Ticket Verification</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body{
    height:100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.container{
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    padding:40px;
    border-radius:20px;
    width:90%;
    max-width:420px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
    animation: fadeIn 1s ease-in-out;
}

h1{
    margin-bottom:10px;
    font-size:24px;
}

.subtitle{
    font-size:14px;
    opacity:0.8;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:18px;
    text-align:center;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

#result{
    margin-top:25px;
    font-size:20px;
    font-weight:bold;
    min-height:40px;
}

.valid{
    color:#4ade80;
    animation: pop 0.4s ease;
}

.invalid{
    color:#f87171;
    animation: pop 0.4s ease;
}

@keyframes pop{
    0%{transform:scale(0.8);opacity:0;}
    100%{transform:scale(1);opacity:1;}
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <h1>🎟 Lucky Draw Ticket Verification</h1>
    <div class="subtitle">Enter your ticket number below to verify instantly</div>

    <input type="number" id="ticket" placeholder="Enter Ticket Number" onkeypress="handleKey(event)">
    <button onclick="checkTicket()">Verify Ticket</button>

    <div id="result"></div>
</div>

<script>
function handleKey(e){
    if(e.key === "Enter"){
        checkTicket();
    }
}

function checkTicket(){
    const num = parseInt(document.getElementById("ticket").value);
    const result = document.getElementById("result");

    if(isNaN(num)){
        result.innerHTML = "⚠ Please enter a valid ticket number.";
        result.className = "invalid";
        return;
    }

    const valid =
        (num >= 6401 && num <= 6414) ||
        (num >= 6416 && num <= 6432) ||
        (num >= 6442 && num <= 6460);

    if(valid){
        result.innerHTML = "🎉 Congratulations! This ticket is successfully registered in the Lucky Draw.";
        result.className = "valid";
    }else{
        result.innerHTML = "❌ This ticket number is not found in the registered list.";
        result.className = "invalid";
    }
}
</script>

</body>
</html>
